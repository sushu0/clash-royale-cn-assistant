name: Pre-commit

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit on all files
        run: uv run --locked --no-sync pre-commit run --all-files
