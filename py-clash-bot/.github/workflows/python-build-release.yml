name: Build release packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/offline-validation.yml

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: validation
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      UV_PROJECT_ENVIRONMENT: D:\codex\ci\build-env
      UV_CACHE_DIR: D:\codex\ci\uv-cache
      PYCLASHBOT_DATA_ROOT: D:\codex\ci\pyclashbot-data
    outputs:
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          enable-cache: true
      - name: Build package
        run: |
          uv run --locked --group build python scripts/setup_msi.py bdist_msi --target-version ${{github.ref_name}}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: './dist/pyclashbot*.msi'
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          prerelease: ${{startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'rc')}}
          generate_release_notes: true
          files: |
            ./dist/pyclashbot*.msi

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: validation
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          enable-cache: true
      - name: Build package
        run: |
          uv run --locked --group build python scripts/setup_macos.py --target-version ${{github.ref_name}}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: './dist/py-clash-bot*.dmg'
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'rc')}}
          files: |
            ./dist/py-clash-bot*.dmg

  notify:
    # External announcements are opt-in; building/tagging alone does not contact anyone.
    if: ${{ vars.ANNOUNCE_DISCORD == 'true' }}
    name: Send Discord notification
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          enable-cache: true
      - name: Trigger Discord Webhook
        run: |
          uv run --locked --group build python scripts/trigger_discord_webhook.py \
            --version "${{ github.ref_name }}" \
            --url "${{ needs.build-windows.outputs.release_url }}" \
            --webhook-code "${{ secrets.DISCORD_WEBHOOK_CODE }}" \
            ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'rc') && '--prerelease' || '' }}
